# ============================================
# Muru — Project Configuration
# ============================================
# This file describes the Muru project to Python's packaging tools,
# defines dependencies, and configures development tools (pytest,
# ruff, mypy).

# ----- Build system -----
# Tells pip how to build this project. Setuptools is the standard.
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ----- Project metadata -----
[project]
name = "muru"
version = "0.1.0"
description = "An AI-native operating system built on the Linux kernel"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "drk230513", email = "drk.ranjithkumar@gmail.com" }
]
keywords = ["ai", "operating-system", "agents", "llm", "intent-based"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Operating System",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Production dependencies — what Muru needs to RUN
dependencies = [
    "ollama>=0.3.0",         # Talk to local LLM via Ollama
    "rich>=13.7.0",          # Pretty terminal output (colors, tables, formatting)
    "pyyaml>=6.0.1",         # Read YAML config files
    "pydantic>=2.5.0",       # Data validation and settings management
    "structlog>=24.1.0",     # Structured logging
]

# Optional/extra dependencies — installed only when explicitly requested
[project.optional-dependencies]
# Dev dependencies — what we need to DEVELOP/TEST Muru
dev = [
    "pytest>=8.0.0",         # Test framework
    "pytest-cov>=4.1.0",     # Test coverage reporting
    "pytest-asyncio>=0.23.0",# Async test support (we'll need this later)
    "ruff>=0.5.0",           # Fast linter + formatter (replaces flake8 + black + isort)
    "mypy>=1.10.0",          # Static type checker
    "types-PyYAML>=6.0.12",  # Type stubs for PyYAML (mypy needs these)
]

# CLI entry point — what `muru` on the command line does
[project.scripts]
muru = "muru.ui.cli.main:main"

# Project URLs (shown on PyPI when we publish)
[project.urls]
Repository = "https://github.com/drk230513/muru-os"
Issues = "https://github.com/drk230513/muru-os/issues"

# ----- Setuptools config -----
# Tells setuptools where our source code lives (the src/ layout)
[tool.setuptools.packages.find]
where = ["src"]
include = ["muru*"]

# ============================================
# Tool configurations
# ============================================

# ----- pytest (test runner) -----
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",                    # Show summary of all test outcomes
    "-m", "not integration",   # Skip integration tests by default
    "--strict-markers",       # Fail if undefined pytest markers used
    "--strict-config",        # Fail if pytest config has errors
    "--showlocals",           # Show local variables in tracebacks
    "-v",                     # Verbose output
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "integration: marks tests as requiring external services",
]

# ----- ruff (linter + formatter) -----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Rule sets to enable. See https://docs.astral.sh/ruff/rules/
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize Python syntax)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions (cleaner comprehensions)
    "SIM",  # flake8-simplify (cleaner logic)
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Test files often use PascalCase for mock variables representing classes.
"tests/**/*.py" = ["N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----- mypy (type checker) -----
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
# Some libraries don't ship type stubs — relax mypy for them
module = "ollama.*"
ignore_missing_imports = true

# ----- Coverage (when running tests with --cov) -----
[tool.coverage.run]
source = ["src/muru"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
